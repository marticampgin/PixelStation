name: Checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system --require-hashes -r backend/requirements-ci.lock
      - run: uv pip install --system --no-deps -e backend
      - run: python -m pytest backend/tests -q
      - run: python -m ruff check backend scripts
      - run: python -m mypy --ignore-missing-imports --check-untyped-defs backend/pixel_station
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
