[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixel-station"
version = "0.1.0"
description = "Local personal AI workstation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3",
  "alembic>=1.13,<2", "pydantic>=2.9,<3", "httpx>=0.27,<1",
  "python-multipart>=0.0.18", "jsonschema>=4.23,<5", "openpyxl>=3.1,<4", "python-docx>=1.1,<2",
  "pypdf>=5,<7", "python-pptx>=1,<2", "reportlab>=4,<5", "pillow>=11,<13",
  "beautifulsoup4>=4.12,<5", "keyring>=25,<26", "google-auth>=2,<3",
  "google-auth-oauthlib>=1.2,<2", "google-api-python-client>=2,<3",
  "tzdata>=2025", "websockets>=14,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8", "mypy>=1.13"]
documents = ["docling>=2,<3"]
vectors = ["sqlite-vec>=0.1"]

[tool.hatch.build.targets.wheel]
packages = ["pixel_station"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
