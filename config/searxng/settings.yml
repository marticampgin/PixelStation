use_default_settings: true
general:
  instance_name: Pixel Station Search
search:
  safe_search: 1
  formats:
    - html
    - json
server:
  limiter: false
  public_instance: false
  image_proxy: false
outgoing:
  request_timeout: 8.0
engines:
  # Independent free index when the default web engines are unavailable.
  # Its index is smaller and does not support safe-search filtering.
  - name: mwmbl
    disabled: false
